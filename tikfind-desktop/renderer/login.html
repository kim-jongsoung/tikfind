<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikFind - 로그인</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        
        .logo {
            font-size: 64px;
            margin-bottom: 20px;
        }
        
        .app-name {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .tagline {
            color: #666;
            margin-bottom: 40px;
            font-size: 14px;
        }
        
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px 30px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .google-btn:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transform: translateY(-2px);
        }
        
        .google-icon {
            width: 24px;
            height: 24px;
        }
        
        .loading {
            display: none;
            margin-top: 20px;
            color: #666;
        }
        
        .loading.active {
            display: block;
        }
        
        .error-message {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 10px;
            color: #c33;
        }
        
        .error-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">🎯</div>
            <h1 class="app-name">TikFind</h1>
            <p class="tagline">TikTok Live 스트리밍을 더 스마트하게</p>
            
            <button class="google-btn" id="googleLoginBtn">
                <svg class="google-icon" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Google로 로그인
            </button>
            
            <div class="loading" id="loading">
                <p>로그인 중...</p>
            </div>
            
            <div class="error-message" id="errorMessage">
                로그인에 실패했습니다. 다시 시도해주세요.
            </div>
        </div>
    </div>

    <script>
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');

        // Google 로그인 버튼 클릭
        googleLoginBtn.addEventListener('click', async () => {
            googleLoginBtn.disabled = true;
            loading.classList.add('active');
            errorMessage.classList.remove('active');

            try {
                await window.tikfind.openBrowser('https://tikfind.kr/auth/google?desktop=true');
            } catch (error) {
                console.error('로그인 오류:', error);
                showError('로그인 실패. 다시 시도해주세요.');
            }
        });

        // OAuth 창 닫힌 → 서버에서 세션 확인
        window.tikfind.onAuthWindowClosed(async () => {
            console.log('🔒 OAuth 창 닫힐, 세션 확인 중...');
            loading.textContent = '로그인 확인 중...';

            try {
                // 서버에서 세션 확인
                const res = await fetch('https://tikfind.kr/auth/current_user', {
                    credentials: 'include'
                });
                const data = await res.json();

                if (data.success && data.user) {
                    console.log('✅ 로그인 성공:', data.user);
                    window.tikfind.loginDone({
                        userId:   data.user._id || data.user.id,
                        tiktokId: data.user.tiktokId || ''
                    });
                } else {
                    showError('로그인이 완료되지 않았습니다. 다시 시도해주세요.');
                }
            } catch (err) {
                console.error('세션 확인 실패:', err);
                showError('서버 연결 실패. 인터넷을 확인해주세요.');
            }
        });

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.add('active');
            loading.classList.remove('active');
            loading.textContent = '로그인 중...';
            googleLoginBtn.disabled = false;
        }
    </script>
</body>
</html>
